name: Build

on:
  workflow_dispatch:        # ручной запуск из вкладки Actions
  push:
    tags:
      - 'v*'               # автоматически при создании тега v1.0.0 и т.п.

jobs:

  # ================= WINDOWS =================
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-glfw
            mingw-w64-x86_64-nlohmann-json

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        run: |
          mkdir -p release
          cp build/CLauncher.exe release/CLauncher-beta.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLauncher-Windows-x64
          path: release/CLauncher-beta.exe

  # ================= LINUX APPIMAGE =================
  build-appimage:
    # Собираем на СТАРОМ Ubuntu 20.04, чтобы AppImage работал на всех
    # более новых дистрибутивах (старый glibc = широкая совместимость).
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake \
            libglfw3-dev libgl1-mesa-dev libcurl4-openssl-dev nlohmann-json3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            file wget

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install into AppDir
        run: DESTDIR="$(pwd)/AppDir" cmake --install build

      - name: Prepare AppDir metadata
        run: |
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp clauncher.desktop AppDir/usr/share/applications/clauncher.desktop
          if [ -f clauncher.png ]; then
            cp clauncher.png AppDir/usr/share/icons/hicolor/256x256/apps/clauncher.png
            cp clauncher.png AppDir/clauncher.png
          fi

      - name: Download linuxdeploy
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        run: |
          export OUTPUT="CLauncher-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/clauncher.desktop \
            --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLauncher-Linux-AppImage
          path: CLauncher-x86_64.AppImage
